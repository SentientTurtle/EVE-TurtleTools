[package]
name = "evestaticdata"
version = "3.0.0"
edition = "2024"
publish = false
repository = "https://github.com/SentientTurtle/EVE-3rd-party-dev-tools"

[features]
default = ["sde"]
sde = ["dep:serde", "dep:serde_json", "indexmap/serde", "uuid/serde", "dep:serde_repr", "dep:reqwest"]
sde_diff = ["sde", "dep:json-patch"]
sde_strict = []
export_hardcoded = ["dep:serde", "dep:serde_json"]
export_sqlite = ["sde", "dep:rusqlite"]
npc_data = ["sde", "dep:serde", "dep:serde_json", "dep:roxmltree"]

[profile.test]
inherits = "release"

[dependencies]
# Used in general types for all features
indexmap = { version = "2.14.1" }
uuid = { version = "1.26.0" }
# Used for 'update' feature
reqwest = { version = "0.13.4", optional = true, features = ["gzip", "blocking", "json"] }
serde_repr = { version = "0.1.21", optional = true }
# Used for SDE exporting
rusqlite = { version = "0.43.0", optional = true, features = ["bundled"] }
# Used for 'serde' feature
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
# Used for 'sde_diff' feature
json-patch = { version = "5.0.0", optional = true }
# Used for 'npc_data' feature
roxmltree = { version = "0.21.1", optional = true }