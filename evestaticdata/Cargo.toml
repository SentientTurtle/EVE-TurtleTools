[package]
name = "evestaticdata"
version = "2.0.0"
edition = "2024"
publish = false
repository = "https://github.com/SentientTurtle/EVE-3rd-party-dev-tools"

[features]
default = ["sde_load"]
sde_update = ["dep:zip", "dep:reqwest", "reqwest/json", "reqwest/blocking", "serde"]
sde_load = ["dep:zip", "serde"]
sde_diff = ["sde_load", "dep:json-patch"]
sde_strict = []
export_sqlite = ["dep:rusqlite", "sde_load"]
serde = ["dep:serde", "dep:serde_json", "dep:serde_repr", "indexmap/serde", "uuid/serde"]
esi_async = ["dep:tokio", "dep:reqwest"]
docs_export = ["dep:evestaticdata_macro"]

[profile.test]
inherits = "release"

[dependencies]
# Used in general types for all features
indexmap = { version = "2.14.1" }
uuid = { version = "1.26.0" }
# Used for 'update' feature
reqwest = { version = "0.13.4", optional = true }
# Used for SDE parsing
zip = { version = "8.3.0", optional = true }
serde_repr = { version = "0.1.21", optional = true }
# Used for SDE exporting
rusqlite = { version = "0.40.2", optional = true, features = ["bundled"] }
# Used for 'serde' feature
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }

tokio = { version = "1.53.1", features = ["net", "time", "rt"], optional = true }

# Used for 'sde_diff' feature
json-patch = { version = "4.2.0", optional = true }

# Used for 'docs-export' feature
evestaticdata_macro = { path = "../evestaticdata-macro", optional = true }