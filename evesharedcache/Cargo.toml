[package]
name = "evesharedcache"
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/SentientTurtle/EVE-3rd-party-dev-tools"

[profile]
test = { opt-level = 3 }

[features]
enable_fsd = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.4", features = ["blocking", "json", "gzip"] }
md-5 = "0.11.0"